		</noscript>
		<script type="module" src="/src/web/main.tsx"></script>
		<script>
			document.addEventListener("click", function (event) {
				var target = event.target;
				if (!(target instanceof Element)) return;

				var trackedElement = target.closest("[data-track]");
				if (!trackedElement) return;

				var posicao = trackedElement.dataset.track;
				if (!posicao) return;

				if (typeof gtag === "function") {
					gtag("event", "click_whatsapp", { posicao: posicao });
				}

				if (typeof fbq === "function") {
					if (
						posicao === "whatsapp_header" ||
						posicao === "whatsapp_hero" ||
						posicao === "whatsapp_sabor" ||
						posicao === "whatsapp_footer"
					) {
						fbq("track", "Lead", { posicao: posicao });
					} else {
						fbq("trackCustom", "CliqueSecundario", { posicao: posicao });
					}
				}
			});
		</script>
	</body>
